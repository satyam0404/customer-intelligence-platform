[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "customer-intelligence-platform"
version = "1.0.0"
description = "Production-grade customer analytics, RFM segmentation, churn prediction, and market basket analysis suite with interactive Streamlit dashboard."
readme = "README.md"
authors = [{ name = "Customer Analytics Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.2.0",
    "numpy>=1.26.0",
    "scikit-learn>=1.4.0",
    "scipy>=1.12.0",
    "plotly>=5.20.0",
    "streamlit>=1.35.0",
    "matplotlib>=3.8.0",
    "seaborn>=0.13.0",
    "jinja2>=3.1.4",
    "openpyxl>=3.1.2",
    "requests>=2.32.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-cov>=5.0.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
addopts = "-v --strict-markers"
